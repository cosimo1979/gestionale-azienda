<script>
/* V2.6 - Verifica tecnica commessa */
const TECH_SECTIONS = {
  'Fotovoltaico': [
    ['impianto','Potenza impianto, moduli, marca/modello e configurazione stringhe'],
    ['inverter','Marca, modello, potenza e numero inverter'],
    ['accumulo','Presenza, marca, modello, capacità e potenza'],
    ['copertura','Tipologia, struttura, orientamenti, inclinazioni e superfici'],
    ['posizionamento','Posizione inverter e accumulo, note e foto'],
    ['collegamenti','Distanze, percorsi cavi, tubazioni e criticità'],
    ['fornitura','POD, distributore, tensione e dati di fornitura'],
    ['quadro','Posizione quadro, spazio disponibile, distanze e foto'],
    ["terra","Dati dell'impianto di terra e misure disponibili"]
  ],
  'Impianto elettrico': [
    ["sopralluogo","Misure, caratteristiche dell'impianto e criticità"],
    ['quadri','Quadri, posizioni, spazi e fotografie'],
    ['linee','Percorsi, lunghezze, tubazioni e sezioni'],
    ['materiali','Materiali principali e relative caratteristiche'],
    ['progetto','Schema, relazione ed elaborati quando necessari']
  ],
  'Quadro elettrico': [
    ['quadro','Posizione, dimensioni, spazio disponibile e foto'],
    ['apparecchiature','Apparecchiature e caratteristiche principali'],
    ['linee','Linee in ingresso/uscita, percorsi e sezioni'],
    ['progetto','Schema unifilare e documentazione di progetto']
  ],
  'Manutenzione': [
    ['impianto','Descrizione impianto e stato rilevato'],
    ['intervento','Attività eseguite e materiali utilizzati'],
    ['prove','Prove/verifiche effettuate e risultato'],
    ['foto','Foto prima/durante/dopo']
  ]
};

function ensureTechStatus(job){
  if(!job.techStatus) job.techStatus = {};
  return job.techStatus;
}
function techSet(jobId, key, status){
  const j = jobs.find(x=>String(x.id)===String(jobId));
  if(!j) return;
  ensureTechStatus(j)[key] = status;
  save();
  renderCurrentJob();
}
function techStatusFor(job,key){
  return (job.techStatus && job.techStatus[key]) || 'missing';
}
function techLabel(s){
  return s==='complete' ? 'Completato' : s==='verify' ? 'Da verificare' : 'Da inserire';
}
function techClass(s){
  return s==='complete' ? 'ok' : s==='verify' ? 'warn' : 'bad';
}
function technicalVerificationHtml(job){
  const type = job.type || 'Altro';
  const rows = TECH_SECTIONS[type] || [];
  if(!rows.length) return '';
  const statuses = ensureTechStatus(job);
  let complete=0;
  const body = rows.map(([key,desc])=>{
    const s=techStatusFor(job,key);
    if(s==='complete') complete++;
    return `<div class="verify-row">
      <div><b>${desc}</b><div class="muted">${key}</div></div>
      <div class="verify-actions">
        <select onchange="techSet('${job.id}','${key}',this.value)">
          <option value="missing" ${s==='missing'?'selected':''}>Da inserire</option>
          <option value="verify" ${s==='verify'?'selected':''}>Da verificare</option>
          <option value="complete" ${s==='complete'?'selected':''}>Completato</option>
        </select>
        <span class="badge ${techClass(s)}">${techLabel(s)}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="card">
    <h3>Verifica informazioni tecniche</h3>
    <p class="muted">Ogni sezione segue il flusso: inserimento → verifica → completato.</p>
    <div class="progress-line"><div style="width:${rows.length?Math.round(complete/rows.length*100):0}%"></div></div>
    <b>${complete}/${rows.length} sezioni completate</b>
    <div class="verify-list">${body}</div>
  </div>`;
}

function technicalSummary(job){
  const rows = TECH_SECTIONS[job.type||'Altro'] || [];
  const st = ensureTechStatus(job);
  const missing = rows.filter(r=>techStatusFor(job,r[0])!=='complete').length;
  return missing ? `Mancano ${missing} verifiche tecniche` : 'Dati tecnici completi';
}
</script>
<script>
async function captureDocumentAsPdf(inputId, jobId, docKey, extra) {
  const input = document.getElementById(inputId);
  if (!input || !input.files || !input.files.length) return;
  const files = Array.from(input.files);
  const imageFiles = files.filter(f => f.type.startsWith('image/'));
  if (!imageFiles.length) return;

  try {
    const { jsPDF } = window.jspdf;
    let pdf = null;

    for (const file of imageFiles) {
      const dataUrl = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });

      const img = await new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = dataUrl;
      });

      const landscape = img.width > img.height;
      const orientation = landscape ? 'landscape' : 'portrait';
      const pageW = landscape ? 297 : 210;
      const pageH = landscape ? 210 : 297;

      if (!pdf) {
        pdf = new jsPDF({ orientation, unit: 'mm', format: 'a4' });
      } else {
        pdf.addPage('a4', orientation);
      }

      const margin = 8;
      const maxW = pageW - margin * 2;
      const maxH = pageH - margin * 2;
      const ratio = Math.min(maxW / img.width, maxH / img.height);
      const w = img.width * ratio;
      const h = img.height * ratio;
      const x = (pageW - w) / 2;
      const y = (pageH - h) / 2;

      pdf.addImage(dataUrl, 'JPEG', x, y, w, h, undefined, 'FAST');
    }

    const blob = pdf.output('blob');
    const pdfFile = new File([blob], 'documento-scansionato.pdf', { type: 'application/pdf' });

    const dt = new DataTransfer();
    dt.items.add(pdfFile);
    input.files = dt.files;

    if (typeof updateDocFile === 'function') {
      updateDocFile(jobId, docKey, input);
    } else if (typeof jobSave === 'function') {
      jobSave();
    }

    const status = document.getElementById(inputId + '_status');
    if (status) status.textContent = 'PDF creato dalla foto e caricato';
  } catch (e) {
    console.error(e);
    alert('Non è stato possibile trasformare la foto in PDF.');
  }
}
</script>
<script>
const KEY='gestionale_v2_data';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{clients:[],jobs:[]};
let currentJob=null, currentTab='overview';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));renderAll()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));renderAll()}
function renderAll(){renderDashboard();renderClients();renderJobs();renderNewJob();if(currentJob)renderJobDetail()}
function renderDashboard(){
 const el=document.getElementById('dashboard'), open=db.jobs.filter(j=>j.status!=='Chiusa').length, blocked=db.jobs.filter(j=>j.status==='Bloccata').length;
 el.innerHTML=`<div class="grid">
 <div class="card"><div class="muted">Clienti</div><div class="stat">${db.clients.length}</div></div>
 <div class="card"><div class="muted">Commesse aperte</div><div class="stat">${open}</div></div>
 <div class="card"><div class="muted">Commesse bloccate</div><div class="stat">${blocked}</div></div></div>
 <div class="card"><h2>Situazione commesse</h2>${db.jobs.length?`<table><tr><th>Commessa</th><th>Cliente</th><th>Tipo</th><th>Stato</th><th>Avanzamento</th><th></th></tr>${db.jobs.map(j=>`<tr><td>${esc(j.number)}</td><td>${esc(clientName(j.clientId))}</td><td>${esc(j.type)}</td><td>${badge(j.status)}</td><td>${progress(j)}%</td><td><button onclick="openJob('${j.id}')">Apri</button></td></tr>`).join('')}</table>`:'<div class="empty">Nessuna commessa. Crea il primo cliente e poi la commessa.</div>'}</div>`;
}
function clientName(cid){return db.clients.find(c=>c.id===cid)?.name||'—'}
function badge(s){let cls=s==='Completata'||s==='Chiusa'?'ok':s==='Bloccata'?'bad':s==='In corso'?'warn':'';return `<span class="badge ${cls}">${esc(s)}</span>`}
function progress(j){let tasks=j.tasks||[];return tasks.length?Math.round(tasks.filter(t=>t.status==='Completata').length/tasks.length*100):0}
function renderClients(){
 const el=document.getElementById('clients');
 el.innerHTML=`<div class="card"><h2>Nuovo cliente</h2>
 <div class="small muted" style="margin-bottom:12px">I campi con * sono obbligatori. I dati numerici devono rispettare la lunghezza prevista.</div>
 <form id="clientForm" novalidate>
 <div class="grid2">
 <div class="field"><label>Nome / Ragione sociale *</label><input id="c_name" required></div>
 <div class="field"><label>Codice fiscale / P.IVA *</label><input id="c_tax" maxlength="16" required placeholder="CF (16) oppure P.IVA (11)"></div>
 <div class="field"><label>Telefono *</label><input id="c_phone" inputmode="numeric" maxlength="10" required placeholder="10 cifre"></div>
 <div class="field"><label>Email *</label><input id="c_email" type="email" required></div>
 <div class="field"><label>Indirizzo *</label><input id="c_address" required></div>
 <div class="field"><label>Note</label><input id="c_notes"></div>
 </div>
 <button type="submit">Salva cliente</button>
 </form></div>
 <div class="card"><h2>Clienti</h2>${db.clients.length?`<table><tr><th>Cliente</th><th>Contatti</th><th>Commesse</th><th></th></tr>${db.clients.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="small muted">${esc(c.tax)}</span></td><td>${esc(c.phone)}<br>${esc(c.email)}</td><td>${db.jobs.filter(j=>j.clientId===c.id).length}</td><td><button class="danger" onclick="deleteClient('${c.id}')">Elimina</button></td></tr>`).join('')}</table>`:'<div class="empty">Nessun cliente inserito.</div>'}</div>`;

 const form=document.getElementById('clientForm');
 const phone=document.getElementById('c_phone');
 const tax=document.getElementById('c_tax');

 phone.addEventListener('input',()=>{phone.value=phone.value.replace(/\\D/g,'').slice(0,10);});
 tax.addEventListener('input',()=>{tax.value=tax.value.toUpperCase().replace(/\\s/g,'').slice(0,16);});

 form.addEventListener('submit',function(e){
   e.preventDefault();
   const name=c_name.value.trim(), taxv=tax.value.trim(), phonev=phone.value.trim(),
         email=c_email.value.trim(), address=c_address.value.trim(), notes=c_notes.value.trim();

   if(!name||!taxv||!phonev||!email||!address){alert('Compila tutti i campi obbligatori (*)');return}
   if(!/^(?:\\d{16}|\\d{11})$/.test(taxv) && !/^[A-Z0-9]{16}$/.test(taxv)){
     alert('Codice fiscale: inserisci esattamente 16 caratteri, oppure Partita IVA: esattamente 11 cifre.');
     tax.focus();return;
   }
   if(/^\\d{11}$/.test(taxv)===false && taxv.length!==16){
     alert('Il Codice Fiscale deve avere esattamente 16 caratteri.');
     tax.focus();return;
   }
   if(phonev.length!==10){alert('Il numero di telefono deve essere composto da esattamente 10 cifre.');phone.focus();return}
   if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)){alert('Inserisci un indirizzo email valido.');c_email.focus();return}

   db.clients.push({id:id(),name,tax:taxv,phone:phonev,email,address,notes});
   localStorage.setItem(KEY,JSON.stringify(db));
   alert('Cliente salvato correttamente.');
   renderAll();
 });
}

function deleteClient(cid){if(db.jobs.some(j=>j.clientId===cid)){alert('Non puoi eliminare un cliente con commesse.');return}if(confirm('Eliminare il cliente?')){db.clients=db.clients.filter(c=>c.id!==cid);save()}}
function renderNewJob(){
 const el=document.getElementById('newjob');
 el.innerHTML=`<div class="card"><h2>Crea nuova commessa</h2>${db.clients.length?`<form onsubmit="addJob(event)">
 <div class="grid2"><div class="field"><label>Numero commessa *</label><input name="number" required placeholder="es. 2026-001"></div>
 <div class="field"><label>Cliente *</label><select name="clientId" required>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div class="field"><label>Tipo lavoro</label><select name="type"><option>Fotovoltaico</option><option>Impianto elettrico</option><option>Quadro elettrico</option><option>Manutenzione</option><option>Altro</option></select></div>
 <div class="field"><label>Indirizzo lavori</label><input name="address"></div>
 <div class="field"><label>Responsabile</label><input name="manager"></div>
 <div class="field"><label>Stato</label><select name="status"><option>Nuova</option><option>In corso</option><option>Bloccata</option></select></div></div>
 <div class="field"><label>Descrizione</label><textarea name="description"></textarea></div><button>Salva commessa</button></form>`:'<div class="empty">Prima devi creare almeno un cliente.</div>'}</div>`;
}
function addJob(e){e.preventDefault();let f=new FormData(e.target);let j={id:id(),number:f.get('number'),clientId:f.get('clientId'),type:f.get('type'),address:f.get('address'),manager:f.get('manager'),status:f.get('status'),description:f.get('description'),created:new Date().toISOString(),survey:{},pv:{},practice:{docs:{},files:{},values:{},status:'Documenti da raccogliere'},tasks:defaultTasks(f.get('type')),photos:[],documents:[],testing:{},invoices:[]};db.jobs.push(j);save();openJob(j.id)}
function defaultTasks(type){if(type==='Fotovoltaico')return ['Preparazione area','Montaggio struttura','Installazione moduli','Posa tubazioni','Posa cavi','Installazione inverter','Installazione accumulo','Installazione quadri','Collegamenti elettrici','Prove e verifiche','Pulizia area','Fine lavori'].map(x=>({id:id(),name:x,status:'Da fare',note:''}));return ['Preparazione','Lavorazione','Verifiche','Pulizia area','Fine lavori'].map(x=>({id:id(),name:x,status:'Da fare',note:''}))}
function renderJobs(){
 const el=document.getElementById('jobs');
 el.innerHTML=`<div class="card"><div class="row"><div><h2 style="margin:0">Commesse</h2></div><input id="jobSearch" placeholder="Cerca numero, cliente, tipo..." oninput="filterJobs()"></div><div id="jobTable"></div></div>`;filterJobs()

 }).join('')}</div>

function updatePracticeValue(docName,value){
 currentJob.practice=currentJob.practice||{docs:{},files:{},values:{}};
 currentJob.practice.values=currentJob.practice.values||{};
 if(docName==='Telefono') value=value.replace(/\\D/g,'').slice(0,10);
 if(docName==='POD') value=value.toUpperCase().replace(/\\s/g,'').slice(0,14);
 if(docName==='IBAN del titolare POD') value=value.toUpperCase().replace(/\\s/g,'').slice(0,27);
 currentJob.practice.values[docName]=value;
 // Changing the value requires a new verification.
 currentJob.practice.docs[docName]=false;
 jobSave();
}
function uploadPracticeDoc(event, docName){
 const file=event.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
   currentJob.practice=currentJob.practice||{docs:{},files:{}};
   currentJob.practice.docs=currentJob.practice.docs||{};
   currentJob.practice.files=currentJob.practice.files||{};
   currentJob.practice.files[docName]={
     name:file.name,
     type:file.type,
     size:file.size,
     date:new Date().toISOString(),
     data:reader.result
   };
   // Loading a new/replaced document resets verification until checked again.
   currentJob.practice.docs[docName]=false;
   jobSave();
 };
 reader.readAsDataURL(file);
}

function verifyPracticeDoc(docName, checked){
 const p=currentJob.practice||{};
 const value=p.values?.[docName]||'';
 const file=p.files?.[docName];

 if(!file && !value){alert('Prima devi inserire il dato oppure caricare il documento.');renderJobDetail();return}
 if(checked){
   if(docName==='Telefono' && !/^\\d{10}$/.test(value)){alert('Il telefono deve contenere esattamente 10 cifre.');renderJobDetail();return}
   if(docName==='IBAN del titolare POD' && !/^IT\\d{25}$/.test(value)){alert('L’IBAN italiano deve contenere esattamente 27 caratteri e iniziare con IT.');renderJobDetail();return}
   if(docName==='POD' && value && value.length!==14){alert('Il POD deve contenere esattamente 14 caratteri.');renderJobDetail();return}
   if(docName==='Email' && value && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value)){alert('Inserisci un indirizzo email valido.');renderJobDetail();return}
 }
 currentJob.practice.docs[docName]=checked;
 jobSave();
}

renderAll();

<div id="docScannerModal">
  <div class="scanner-box">
    <div class="scanner-head">
      <b>Scansione documento</b>
      <button type="button" onclick="closeDocumentScanner()">✕</button>
    </div>

      <video id="scannerVideo" autoplay playsinline></video>
      <div id="scannerGuide"></div>
    </div>
    <div id="scannerStatus" class="scanner-status">Inquadra il documento e scatta la foto.</div>
    <div class="scanner-controls">
      <button type="button" onclick="scannerTakePhoto()">📷 Scatta</button>
      <button type="button" onclick="scannerChoosePhoto()">🖼️ Galleria</button>
      <button type="button" onclick="scannerFinish()" class="primary">✓ Crea PDF</button>
      <button type="button" onclick="closeDocumentScanner()">Annulla</button>
    </div>

    <input id="scannerFileInput" type="file" accept="image/*" multiple style="display:none">
  </div>

<script>
let scannerStream=null, scannerPages=[], scannerTargetInputId=null;

function openDocumentScanner(inputId){
  scannerTargetInputId=inputId;
  scannerPages=[];
  document.getElementById('scannerPages').innerHTML='';
  document.getElementById('scannerStatus').textContent='Inquadra il documento e scatta la foto.';
  document.getElementById('docScannerModal').style.display='block';
  navigator.mediaDevices?.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})
    .then(s=>{scannerStream=s; document.getElementById('scannerVideo').srcObject=s;})
    .catch(()=>document.getElementById('scannerStatus').textContent='Fotocamera non disponibile: usa "Galleria".');
}
function closeDocumentScanner(){
  if(scannerStream) scannerStream.getTracks().forEach(t=>t.stop());
  scannerStream=null;
  document.getElementById('scannerVideo').srcObject=null;
  document.getElementById('docScannerModal').style.display='none';
}
function scannerChoosePhoto(){ document.getElementById('scannerFileInput').click(); }

document.addEventListener('change', e=>{
  if(e.target.id!=='scannerFileInput') return;
  [...e.target.files].forEach(file=>{
    const r=new FileReader();
    r.onload=()=>processScannerImage(r.result);
    r.readAsDataURL(file);
  });
  e.target.value='';
});

function scannerTakePhoto(){
  const v=document.getElementById('scannerVideo');
  if(!v.videoWidth) return;
  const c=document.createElement('canvas');
  const max=2200, scale=Math.min(1,max/v.videoWidth);
  c.width=Math.round(v.videoWidth*scale); c.height=Math.round(v.videoHeight*scale);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  processScannerImage(c.toDataURL('image/jpeg',.94));
}

function cvReady(){
  return typeof cv!=='undefined' && cv.Mat && cv.imread;
}
function orderPts(p){
  p=p.slice().sort((a,b)=>a.y-b.y);
  const top=p.slice(0,2).sort((a,b)=>a.x-b.x);
  const bottom=p.slice(2,4).sort((a,b)=>a.x-b.x);
  return [top[0],top[1],bottom[1],bottom[0]];
}
function processScannerImage(dataUrl){
  document.getElementById('scannerStatus').textContent='Rilevamento foglio e correzione prospettiva…';
  if(!cvReady()){
    // If OpenCV has not loaded yet, retain the original image rather than failing.
    addScannerPage(dataUrl);
    document.getElementById('scannerStatus').textContent='Foto acquisita. Correzione automatica non ancora disponibile.';
    return;
  }
  try{
    const img=new Image();
    img.onload=()=>{
      const max=1800, scale=Math.min(1,max/img.width);
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);

      let src=cv.imread(c), gray=new cv.Mat(), blur=new cv.Mat(), edge=new cv.Mat(), contours=new cv.MatVector(), hier=new cv.Mat();
      cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
      cv.Canny(blur,edge,50,150);
      cv.findContours(edge,contours,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);

      let best=null,bestArea=0, imageArea=c.width*c.height;
      for(let i=0;i<contours.size();i++){
        let cnt=contours.get(i), peri=cv.arcLength(cnt,true), approx=new cv.Mat();
        cv.approxPolyDP(cnt,approx,.02*peri,true);
        let area=Math.abs(cv.contourArea(approx));
        if(approx.rows===4 && area>bestArea && area>imageArea*.15){
          bestArea=area; best=approx.clone();
        }
        approx.delete(); cnt.delete();
      }

      if(best){
        let pts=[];
        for(let i=0;i<4;i++){
          pts.push({x:best.intAt(i,0),y:best.intAt(i,1)});
        }
        pts=orderPts(pts);
        const w1=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);
        const w2=Math.hypot(pts[2].x-pts[3].x,pts[2].y-pts[3].y);
        const h1=Math.hypot(pts[3].x-pts[0].x,pts[3].y-pts[0].y);
        const h2=Math.hypot(pts[2].x-pts[1].x,pts[2].y-pts[1].y);
        const W=Math.max(600,Math.min(1800,Math.round(Math.max(w1,w2))));
        const H=Math.max(800,Math.min(2400,Math.round(Math.max(h1,h2))));
        const srcPts=cv.matFromArray(4,1,cv.CV_32FC2,pts.flatMap(p=>[p.x,p.y]));
        const dstPts=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,W-1,0,W-1,H-1,0,H-1]);
        const M=cv.getPerspectiveTransform(srcPts,dstPts), dst=new cv.Mat();
        cv.warpPerspective(src,dst,M,new cv.Size(W,H));
        const out=document.createElement('canvas'); out.width=W; out.height=H;
        cv.imshow(out,dst); addScannerPage(out.toDataURL('image/jpeg',.94));
        srcPts.delete();dstPts.delete();M.delete();dst.delete();
      }else{
        addScannerPage(dataUrl);
      }
      src.delete();gray.delete();blur.delete();edge.delete();contours.delete();hier.delete();
      document.getElementById('scannerStatus').textContent='Pagina acquisita. Puoi aggiungerne altre.';
    };
    img.src=dataUrl;
  }catch(e){
    console.error(e); addScannerPage(dataUrl);
    document.getElementById('scannerStatus').textContent='Pagina acquisita.';
  }
}
function addScannerPage(dataUrl){
  scannerPages.push(dataUrl);
  const box=document.getElementById('scannerPages');
  const wrap=document.createElement('div'); wrap.className='scanner-page';
  const im=document.createElement('img'); im.src=dataUrl;
  const b=document.createElement('button'); b.textContent='×';
  b.onclick=()=>{const i=scannerPages.indexOf(dataUrl); if(i>=0) scannerPages.splice(i,1); wrap.remove();};
  wrap.append(im,b); box.appendChild(wrap);
}
async function scannerFinish(){
  if(!scannerPages.length){ alert('Acquisisci almeno una pagina.'); return; }
  if(!window.jspdf){ alert('Modulo PDF non disponibile.'); return; }
  const {jsPDF}=window.jspdf;
  let pdf=null;
  for(const src of scannerPages){
    const img=await new Promise((res,rej)=>{let i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
    const landscape=img.width>img.height, pw=landscape?297:210, ph=landscape?210:297;
    if(!pdf) pdf=new jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4'});
    else pdf.addPage('a4',landscape?'landscape':'portrait');
    const m=7, rw=pw-2*m, rh=ph-2*m, r=Math.min(rw/img.width,rh/img.height);
    pdf.addImage(src,'JPEG',(pw-img.width*r)/2,(ph-img.height*r)/2,img.width*r,img.height*r,undefined,'FAST');
  }
  const blob=pdf.output('blob'), file=new File([blob],'documento-scansionato.pdf',{type:'application/pdf'});
  const dt=new DataTransfer(); dt.items.add(file);
  const target=document.getElementById(scannerTargetInputId);
  if(target){target.files=dt.files; target.dispatchEvent(new Event('change',{bubbles:true}));}
  closeDocumentScanner();
}
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.warn));

let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  const b=document.getElementById('installAppBtn');
  if(b) b.style.display='inline-block';
});
async function installGestionale(){
  if(!deferredInstallPrompt){
    alert('Se il pulsante non è disponibile, apri il gestionale in Chrome/Safari e usa "Aggiungi alla schermata Home".');
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  const b=document.getElementById('installAppBtn');
  if(b) b.style.display='none';
}
</script>
<button id="installAppBtn" type="button" onclick="installGestionale()">📱 Installa app</button></body>

<script>
function appendTechnicalVerification(){
  try{
    const j = (typeof currentJob !== 'undefined' && currentJob) ? currentJob : null;
    if(!j) return;
    const type = j.type || '';
    if(!TECH_SECTIONS[type]) return;
    const existing = document.getElementById('v26-tech-verification');
    if(existing) existing.remove();

    // Find the main visible job detail area.
    const candidates = Array.from(document.querySelectorAll('.card, main, #app, body'));
    let target = candidates.find(el => el.querySelector && el.querySelector('h2,h1') && /commessa|dettaglio/i.test(el.innerText||''));
    if(!target) target = document.querySelector('main') || document.body;

    const wrap=document.createElement('div');
    wrap.id='v26-tech-verification';
    wrap.innerHTML=technicalVerificationHtml(j);
    target.appendChild(wrap);
  }catch(e){console.error(e)}
}
const _renderCurrentJob0 = window.renderCurrentJob;
if(typeof _renderCurrentJob0==='function'){
  window.renderCurrentJob=function(){ _renderCurrentJob0(); setTimeout(appendTechnicalVerification,0); };
}
</script>
